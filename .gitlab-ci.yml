# Pipeline CI GitLab.
#
# Le runner Linux (dotnet/sdk:9.0) n'embarque pas le workload MAUI : ni
# net9.0-android ni net9.0-windows n'y sont buildables. On cible donc
# explicitement les projets serveur pour build/test.
# Le client MAUI est verifie via GitHub Actions sur runner Windows,
# ou compile localement.

stages:
  - build
  - test
  - docker

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Projets non-MAUI - le glob par defaut de "dotnet build" prendrait tout le repo.
  PROJETS_SERVEUR: >-
    src/FactoryTrack.Domain/FactoryTrack.Domain.csproj
    src/FactoryTrack.Contracts/FactoryTrack.Contracts.csproj
    src/FactoryTrack.Infrastructure/FactoryTrack.Infrastructure.csproj
    src/FactoryTrack.Positioning/FactoryTrack.Positioning.csproj
    src/FactoryTrack.Api/FactoryTrack.Api.csproj
    src/FactoryTrack.Ingestion/FactoryTrack.Ingestion.csproj
    src/FactoryTrack.Simulator/FactoryTrack.Simulator.csproj

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0

compilation:
  stage: build
  script:
    - |
      for p in $PROJETS_SERVEUR; do
        dotnet build "$p" --configuration Release
      done
  artifacts:
    expire_in: 1 hour
    paths:
      - "src/**/bin/Release/"

tests-unitaires:
  stage: test
  script:
    - dotnet test tests/FactoryTrack.UnitTests/FactoryTrack.UnitTests.csproj
        --configuration Release
        --collect:"XPlat Code Coverage"
        --results-directory ./couverture
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - couverture/

tests-integration:
  stage: test
  # Docker-in-Docker pour laisser Testcontainers demarrer TimescaleDB.
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Le SDK .NET n'est pas dans l'image docker:27, on l'ajoute.
    - apk add --no-cache dotnet9-sdk
  script:
    - dotnet test tests/FactoryTrack.IntegrationTests/FactoryTrack.IntegrationTests.csproj
        --configuration Release
  allow_failure: true

images:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker compose build
