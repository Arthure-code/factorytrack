# Pipeline CI GitLab (miroir minimal du pipeline Azure DevOps principal).
#
# Le runner Linux (dotnet/sdk:9.0) n'embarque pas le workload MAUI : on
# passe par FactoryTrack.Server.slnf, un solution filter qui exclut le
# projet mobile. Le client MAUI est teste sur runner Windows via le
# pipeline Azure DevOps (voir azure-pipelines.yml).

stages:
  - build
  - test
  - docker

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SOLUTION_SERVEUR: 'FactoryTrack.Server.slnf'

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0

compilation:
  stage: build
  script:
    - dotnet restore $SOLUTION_SERVEUR
    - dotnet build $SOLUTION_SERVEUR --configuration Release --no-restore
  artifacts:
    expire_in: 1 hour
    paths:
      - "src/**/bin/Release/"
      - "tests/**/bin/Release/"

tests-unitaires:
  stage: test
  script:
    - dotnet test tests/FactoryTrack.UnitTests/FactoryTrack.UnitTests.csproj
        --configuration Release
        --collect:"XPlat Code Coverage"
        --results-directory ./couverture
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - couverture/

tests-integration:
  stage: test
  # Docker-in-Docker pour laisser Testcontainers demarrer TimescaleDB.
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache dotnet9-sdk
  script:
    - dotnet test tests/FactoryTrack.IntegrationTests/FactoryTrack.IntegrationTests.csproj
        --configuration Release
  allow_failure: true

images:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker compose build
