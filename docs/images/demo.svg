<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <!--
    Illustration synthetique du client MAUI FactoryTrack.
    Ce n'est PAS une capture de l'app reelle : trajectoires simulees pour
    illustrer le principe. Coordonnees : plan 60 m x 40 m a 12 px/m,
    origine (0,0) en bas a gauche (l'axe Y est inverse en SVG).
    Le plan commence a y=90 pour laisser le bandeau superieur respirer.
  -->

  <!-- Fond -->
  <rect width="800" height="620" fill="#FFFFFF"/>

  <!-- Bandeau d'entete -->
  <text x="40" y="38" font-size="22" font-weight="700" fill="#1E3A5F">Plan de l'usine</text>
  <g transform="translate(40,68)">
    <circle cx="0" cy="0" r="5" fill="#27AE60"/>
    <text x="12" y="5" font-size="13" fill="#303A4A">En direct</text>
    <text x="72" y="5" font-size="13" fill="#6B7684">· 10 equipements</text>
  </g>

  <!-- Cadre du plan (720x480 = 60m x 40m a 12 px/m), decale a y=90 -->
  <rect x="40" y="90" width="720" height="480" fill="#F6F7F9" stroke="#303A4A" stroke-width="2"/>

  <!-- Grille tous les 5 m (60 px) -->
  <g stroke="#E0E4EA" stroke-width="1">
    <line x1="100" y1="90" x2="100" y2="570"/>
    <line x1="160" y1="90" x2="160" y2="570"/>
    <line x1="220" y1="90" x2="220" y2="570"/>
    <line x1="280" y1="90" x2="280" y2="570"/>
    <line x1="340" y1="90" x2="340" y2="570"/>
    <line x1="400" y1="90" x2="400" y2="570"/>
    <line x1="460" y1="90" x2="460" y2="570"/>
    <line x1="520" y1="90" x2="520" y2="570"/>
    <line x1="580" y1="90" x2="580" y2="570"/>
    <line x1="640" y1="90" x2="640" y2="570"/>
    <line x1="700" y1="90" x2="700" y2="570"/>

    <line x1="40" y1="150" x2="760" y2="150"/>
    <line x1="40" y1="210" x2="760" y2="210"/>
    <line x1="40" y1="270" x2="760" y2="270"/>
    <line x1="40" y1="330" x2="760" y2="330"/>
    <line x1="40" y1="390" x2="760" y2="390"/>
    <line x1="40" y1="450" x2="760" y2="450"/>
    <line x1="40" y1="510" x2="760" y2="510"/>
  </g>

  <!-- Zones -->
  <!-- Quai de chargement : (0,0)-(15,12) m -->
  <g>
    <rect x="40" y="426" width="180" height="144" fill="#2ECC71" fill-opacity="0.15" stroke="#27AE60" stroke-width="1.5"/>
    <text x="46" y="440" font-size="12" fill="#27AE60">Quai de chargement</text>
  </g>
  <!-- Zone de production : (15,5)-(50,35) m -->
  <g>
    <rect x="220" y="150" width="420" height="360" fill="#2ECC71" fill-opacity="0.15" stroke="#27AE60" stroke-width="1.5"/>
    <text x="226" y="164" font-size="12" fill="#27AE60">Zone de production</text>
  </g>
  <!-- Local electrique (interdite) : (52,32)-(60,40) m -->
  <g>
    <rect x="664" y="90" width="96" height="96" fill="#E74C3C" fill-opacity="0.19" stroke="#C0392B" stroke-width="1.5"/>
    <text x="670" y="104" font-size="12" fill="#C0392B">Local electrique</text>
  </g>

  <!-- Passerelles aux 4 coins (au niveau de la bordure du plan) -->
  <g stroke="#2C3E50" stroke-width="2" fill="none">
    <line x1="34" y1="564" x2="46" y2="576"/><line x1="34" y1="576" x2="46" y2="564"/>
    <line x1="754" y1="564" x2="766" y2="576"/><line x1="754" y1="576" x2="766" y2="564"/>
    <line x1="754" y1="84" x2="766" y2="96"/><line x1="754" y1="96" x2="766" y2="84"/>
    <line x1="34" y1="84" x2="46" y2="96"/><line x1="34" y1="96" x2="46" y2="84"/>
  </g>
  <g fill="#2C3E50" font-size="10">
    <text x="52" y="588">GW-01</text>
    <text x="722" y="588">GW-02</text>
    <text x="722" y="82">GW-03</text>
    <text x="52" y="82">GW-04</text>
  </g>

  <!--
    Trajectoires en boucle (path fermes) pour chaque tag.
    Cycle 15 s ; TAG-04 et TAG-08 traversent le Local electrique et virent
    au rouge pendant l'intrusion.
  -->
  <defs>
    <path id="t1"  d="M120,530 L160,510 L180,538 L140,550 Z"/>
    <path id="t2"  d="M300,460 L360,440 L340,490 L280,480 Z"/>
    <path id="t3"  d="M430,400 L490,380 L510,430 L450,440 Z"/>
    <path id="t4"  d="M600,240 L660,200 L710,140 L680,120 L620,200 L580,260 Z"/>
    <path id="t5"  d="M250,300 L310,280 L330,330 L270,340 Z"/>
    <path id="t6"  d="M540,300 L590,280 L620,340 L560,350 Z"/>
    <path id="t7"  d="M380,240 L440,220 L460,270 L400,280 Z"/>
    <path id="t8"  d="M560,220 L640,180 L710,140 L700,120 L640,140 L580,180 Z"/>
    <path id="t9"  d="M400,500 L460,480 L480,530 L420,540 Z"/>
    <path id="t10" d="M180,240 L240,220 L260,270 L200,280 Z"/>
  </defs>

  <style>
    .pt { fill: #2177BB; stroke: #FFFFFF; stroke-width: 1.5; }
    .lbl { fill: #1A5D92; font-size: 11px; font-weight: 700; }
  </style>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" repeatCount="indefinite" rotate="0"><mpath href="#t1"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-01
      <animateMotion dur="15s" repeatCount="indefinite" rotate="0"><mpath href="#t1"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="1s" repeatCount="indefinite" rotate="0"><mpath href="#t2"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-02
      <animateMotion dur="15s" begin="1s" repeatCount="indefinite" rotate="0"><mpath href="#t2"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="2s" repeatCount="indefinite" rotate="0"><mpath href="#t3"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-03
      <animateMotion dur="15s" begin="2s" repeatCount="indefinite" rotate="0"><mpath href="#t3"/></animateMotion>
    </text>
  </g>

  <!-- TAG-04 : dans Local electrique de 5.4s a 8.4s / 15s -->
  <g>
    <circle r="5" stroke="#FFFFFF" stroke-width="1.5">
      <animate attributeName="fill" dur="15s" repeatCount="indefinite"
               values="#2177BB;#2177BB;#C0392B;#C0392B;#2177BB;#2177BB"
               keyTimes="0;0.36;0.4;0.56;0.6;1"/>
      <animateMotion dur="15s" repeatCount="indefinite" rotate="0"><mpath href="#t4"/></animateMotion>
    </circle>
    <text dx="7" dy="-6" font-size="11" font-weight="700">
      <animate attributeName="fill" dur="15s" repeatCount="indefinite"
               values="#1A5D92;#1A5D92;#943126;#943126;#1A5D92;#1A5D92"
               keyTimes="0;0.36;0.4;0.56;0.6;1"/>
      TAG-04
      <animateMotion dur="15s" repeatCount="indefinite" rotate="0"><mpath href="#t4"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="3s" repeatCount="indefinite" rotate="0"><mpath href="#t5"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-05
      <animateMotion dur="15s" begin="3s" repeatCount="indefinite" rotate="0"><mpath href="#t5"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="1.5s" repeatCount="indefinite" rotate="0"><mpath href="#t6"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-06
      <animateMotion dur="15s" begin="1.5s" repeatCount="indefinite" rotate="0"><mpath href="#t6"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="2.5s" repeatCount="indefinite" rotate="0"><mpath href="#t7"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-07
      <animateMotion dur="15s" begin="2.5s" repeatCount="indefinite" rotate="0"><mpath href="#t7"/></animateMotion>
    </text>
  </g>

  <!-- TAG-08 : dans Local electrique de 3.9s a 6.5s / 15s (decale de 4s) -->
  <g>
    <circle r="5" stroke="#FFFFFF" stroke-width="1.5">
      <animate attributeName="fill" dur="15s" begin="4s" repeatCount="indefinite"
               values="#2177BB;#2177BB;#C0392B;#C0392B;#2177BB;#2177BB"
               keyTimes="0;0.26;0.3;0.43;0.46;1"/>
      <animateMotion dur="15s" begin="4s" repeatCount="indefinite" rotate="0"><mpath href="#t8"/></animateMotion>
    </circle>
    <text dx="7" dy="-6" font-size="11" font-weight="700">
      <animate attributeName="fill" dur="15s" begin="4s" repeatCount="indefinite"
               values="#1A5D92;#1A5D92;#943126;#943126;#1A5D92;#1A5D92"
               keyTimes="0;0.26;0.3;0.43;0.46;1"/>
      TAG-08
      <animateMotion dur="15s" begin="4s" repeatCount="indefinite" rotate="0"><mpath href="#t8"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="0.5s" repeatCount="indefinite" rotate="0"><mpath href="#t9"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-09
      <animateMotion dur="15s" begin="0.5s" repeatCount="indefinite" rotate="0"><mpath href="#t9"/></animateMotion>
    </text>
  </g>

  <g>
    <circle r="5" class="pt">
      <animateMotion dur="15s" begin="3.5s" repeatCount="indefinite" rotate="0"><mpath href="#t10"/></animateMotion>
    </circle>
    <text class="lbl" dx="7" dy="-6">TAG-10
      <animateMotion dur="15s" begin="3.5s" repeatCount="indefinite" rotate="0"><mpath href="#t10"/></animateMotion>
    </text>
  </g>

  <!-- Legende de bas -->
  <text x="40" y="605" font-size="11" fill="#6B7684">
    Illustration synthetique — capture reelle de l'app MAUI a venir
  </text>
</svg>
